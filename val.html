    } catch (error) {

    }

        function moverFoco(event, index) {
            let inputs = document.querySelectorAll('.codigo-input');

            if (event.inputType === "deleteContentBackward") {
                inputs[index].value = '';
                if (index > 0) inputs[index - 1].focus();
            } else if (event.data && event.data.match(/[0-9]/)) {
                inputs[index].value = event.data;
                if (index < 5) inputs[index + 1].focus();
            }
        }
